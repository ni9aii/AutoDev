[package]
name = "autodev-jev"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional Jev (TypeSafe System One) classification layer for AutoDev review findings"

[dependencies]
anyhow = "1.0"
kunobi-jev = { version = "0.2", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
kunobi-jev = { version = "0.2", default-features = false, features = [
    "rustls",
    "blocking",
    "testing",
] }
tokio = { version = "1", features = ["rt", "macros"] }
