name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege: the test job only needs to read contents to check out.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/index
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release
        run: cargo build --locked --release

      - name: Install cargo-audit
        # Blocking: hard-fails CI on any known RUSTSEC advisory.
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autodev-${{ matrix.os }}
          path: |
            target/release/run-pipeline*
            target/release/ci-check*
            target/release/review-aggregator*

  gen-check:
    name: Skill generator drift + functional check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Re-render skill surfaces
        run: bash tools/gen.sh

      - name: Fail if any rendered skill drifted from source
        run: |
          if ! git diff --exit-code -- SKILL.md skills/hermes/SKILL.md skills/claude-code/SKILL.md; then
            echo "::error::Rendered skills drifted from SKILL.core.md/harnesses/*.overlay."
            echo "Run 'bash tools/gen.sh' locally and commit the result."
            exit 1
          fi
          echo "Skill surfaces are in sync with source."

      - name: Functional checks (generator + installer)
        run: |
          set -eu
          echo "== no unfilled placeholders =="
          if grep -rn '{{' SKILL.md skills/hermes/SKILL.md skills/claude-code/SKILL.md; then
            echo "::error::Found unfilled {{placeholder}} in rendered skill"; exit 1
          fi
          echo "== frontmatter present =="
          test "$(head -1 SKILL.md)" = '---' || { echo "::error::SKILL.md missing frontmatter"; exit 1; }
          echo "== references symlinks valid =="
          for h in hermes claude-code; do
            test -L "skills/$h/references" || { echo "::error::skills/$h/references must be a symlink"; exit 1; }
            test "$(readlink "skills/$h/references")" = "../../references" || { echo "::error::skills/$h/references wrong target: $(readlink "skills/$h/references")"; exit 1; }
            # readability through the link proves the link resolves in CI checkout
            head -1 "skills/$h/references/troubleshooting.md" >/dev/null || { echo "::error::cannot read through symlink for $h"; exit 1; }
          done
          echo "== artifact path contract consistent across surfaces =="
          # The aggregator reads reviews/<YYYYMMDD_HHMMSS>/<role>-review.md.
          # Every rendered surface must document exactly this layout — a
          # divergent path string silently produces empty plans (Deferred-1).
          PAT='reviews/<YYYYMMDD_HHMMSS>/<role>-review.md'
          for f in SKILL.md skills/hermes/SKILL.md skills/claude-code/SKILL.md; do
            grep -qF "$PAT" "$f" || { echo "::error::$f does not document the artifact path contract ($PAT)"; exit 1; }
          done
          if grep -rE 'reviews/<YYYY-MM-DD>|review-report\.md' SKILL.md skills/hermes/SKILL.md skills/claude-code/SKILL.md harnesses/ SKILL.core.md; then
            echo "::error::stale artifact path format found (see above)"; exit 1
          fi
          echo "install.sh checks follow"
          echo "== install.sh --list works =="
          ./install.sh --list > /tmp/il.txt 2>&1
          grep -q hermes /tmp/il.txt || { echo "::error::install.sh --list broken"; exit 1; }
          echo "== install into temp root, --check must report present (0) =="
          rm -rf /tmp/adtest
          AUTODEV_INSTALL_ROOT=/tmp/adtest ./install.sh --harness claude-code > /tmp/inst.txt 2>&1
          AUTODEV_INSTALL_ROOT=/tmp/adtest ./install.sh --harness claude-code --check > /tmp/ic.txt 2>&1 && rc=0 || rc=$?
          test "$rc" -eq 0 || { echo "::error::--check should exit 0 after install, got $rc"; exit 1; }
          echo "== --check on different (empty) root must report missing (1) =="
          AUTODEV_INSTALL_ROOT=/tmp/adtest2 ./install.sh --harness claude-code --check > /tmp/ic2.txt 2>&1 && rc=0 || rc=$?
          test "$rc" -eq 1 || { echo "::error::--check should exit 1 for missing install, got $rc"; exit 1; }
          echo "== install.sh rejects unknown harness =="
          if ./install.sh --harness nope --check > /tmp/in.txt 2>&1; then
            echo "::error::unknown harness should fail"; exit 1
          fi
          echo "All generator + installer checks passed."
