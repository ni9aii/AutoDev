name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/index
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-release-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build release
        run: |
          . $HOME/.cargo/env
          cargo build --locked --release

      - name: Run tests
        run: |
          . $HOME/.cargo/env
          cargo test --locked --release --verbose

      - name: Generate checksums
        # Publishes AutoDev-<tag>-sha256.txt as a release asset. One
        # "<digest>  <filename>" line per artifact; install.sh --remote matches
        # its downloaded tarball by the "<tag>.tar.gz" filename column (the
        # codeload archive is re-fetched here so its digest is real, not
        # assumed).
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd target/release
          {
            sha256sum run-pipeline ci-check review-aggregator
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" \
              | sha256sum | awk -v t="${TAG}.tar.gz" '{ print $1 "  " t }'
          } > "AutoDev-${TAG}-sha256.txt"
          cat "AutoDev-${TAG}-sha256.txt"

      - name: Attach release binaries
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            target/release/run-pipeline
            target/release/ci-check
            target/release/review-aggregator
            target/release/AutoDev-*-sha256.txt

      # Producer verifies consumer: right after publishing, run the --remote
      # installer end-to-end against THIS release (fresh tag), so the one-line
      # install path is exercised on every real release without relying on
      # anyone remembering to trigger it manually.
      - name: Verify one-line remote install of this release
        if: runner.os == 'Linux'
        env:
          AUTODEV_INSTALL_ROOT: /tmp/adremote-e2e
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/autodev-src
          bash /tmp/autodev-src/install.sh --remote "${GITHUB_REF_NAME}" --harness hermes
          test -f "$AUTODEV_INSTALL_ROOT/.hermes/skills/autonomous-ai-agents/autodev/SKILL.md"
          head -1 "$AUTODEV_INSTALL_ROOT/.hermes/skills/autonomous-ai-agents/autodev/SKILL.md" | grep -q -- '---'
          echo "One-line install of ${GITHUB_REF_NAME} verified."
